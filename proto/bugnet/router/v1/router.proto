syntax = "proto3";

package bugnet.router.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/oynozan/bugnet-proto/gen/go/bugnet/router/v1;routerv1";

// ErrorInfo reasons include HANDLE_UNKNOWN, JOB_UNKNOWN, FILE_NOT_FOUND, PACKAGE_UNKNOWN and
// NOT_START_PACKAGE
service SandboxRouterService {
  rpc Estimate(EstimateRequest) returns (EstimateResponse);
  // Prices a start package as a start would find it now, spending no quote limit, writing no row
  rpc PricePackage(PricePackageRequest) returns (PricePackageResponse);
  rpc CreatePlacement(CreatePlacementRequest) returns (CreatePlacementResponse);
  rpc GetPlacement(GetPlacementRequest) returns (GetPlacementResponse);
  rpc WatchPlacement(WatchPlacementRequest) returns (stream WatchPlacementResponse);
  rpc ExtendPlacement(ExtendPlacementRequest) returns (ExtendPlacementResponse);
  rpc CheckExtendPlacement(CheckExtendPlacementRequest) returns (CheckExtendPlacementResponse);
  rpc ListExtensions(ListExtensionsRequest) returns (ListExtensionsResponse);
  rpc StopPlacement(StopPlacementRequest) returns (StopPlacementResponse);
  rpc Exec(ExecRequest) returns (ExecResponse);
  rpc WatchJob(WatchJobRequest) returns (stream WatchJobResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc ReadFile(ReadFileRequest) returns (ReadFileResponse);
  rpc WriteFile(WriteFileRequest) returns (WriteFileResponse);
  rpc ListFiles(ListFilesRequest) returns (ListFilesResponse);
  rpc CreatePreview(CreatePreviewRequest) returns (CreatePreviewResponse);
  rpc CreateTransfer(CreateTransferRequest) returns (CreateTransferResponse);
  rpc AddSshKey(AddSshKeyRequest) returns (AddSshKeyResponse);
  rpc RemoveSshKey(RemoveSshKeyRequest) returns (RemoveSshKeyResponse);
  rpc CreateSecretLink(CreateSecretLinkRequest) returns (CreateSecretLinkResponse);
  // A 10-minute grant the bridge sends to the secrets route instead of the handle
  rpc CreateSecretPutGrant(CreateSecretPutGrantRequest) returns (CreateSecretPutGrantResponse);
  rpc GetSecretSealingKey(GetSecretSealingKeyRequest) returns (GetSecretSealingKeyResponse);
  rpc PutSecret(PutSecretRequest) returns (PutSecretResponse);
  rpc ListSecrets(ListSecretsRequest) returns (ListSecretsResponse);
  rpc DeleteSecret(DeleteSecretRequest) returns (DeleteSecretResponse);
  // Puts the placement's GitHub source in the sandbox, safe to call again
  rpc FetchSource(FetchSourceRequest) returns (FetchSourceResponse);
  // Checks an x402 change without making it, and with no handle only what needs no placement
  rpc CheckX402(CheckX402Request) returns (CheckX402Response);
  // Stores x402 services and applies them to the sandbox, idempotent by content
  rpc EnableX402(EnableX402Request) returns (EnableX402Response);
  // Lists the placement's x402 services with their states and counts, and its refusals
  rpc ListX402(ListX402Request) returns (ListX402Response);
}

/* Packages and estimates */

message Resources {
  uint32 vcpu = 1;
  uint32 memory_mib = 2;
  uint32 disk_gib = 3;
  uint32 gpu_count = 4;
  uint32 gpu_memory_gib = 5;
}

message Requirements {
  bool ssh = 1;
  bool preview = 2;
  bool gpu = 3;
  // The order will add secrets, so the provider's secret path must be proven
  bool secrets = 4;
}

// What the package lacks against a floor
enum Dimension {
  DIMENSION_UNSPECIFIED = 0;
  DIMENSION_VCPU = 1;
  DIMENSION_MEMORY = 2;
  DIMENSION_DISK = 3;
  DIMENSION_GPU = 4;
  DIMENSION_GPU_MEMORY = 5;
  DIMENSION_MINUTES = 6;
}

message PackageOption {
  string package_id = 1;
  Resources resources = 2;
  uint32 minutes = 3;
  int64 price_micros = 4;
  bool available = 5;
  // no_candidate, feature_unavailable or internal, in ListExtensions not_ready or exceeds_lifetime
  string unavailable_reason = 6;
  // The package covers the floor, counting the extensions below
  bool fits = 7;
  // Extensions needed to cover the floor's minutes
  uint32 extensions_needed = 8;
  // What the package lacks when it does not fit
  repeated Dimension short_on = 9;
  // The extension package counted above, empty when none is needed
  string extension_package_id = 10;
  // price_micros plus the extensions needed
  int64 total_price_micros = 11;
}

// What the agent says it will run, bugnet_quote's workload
enum Workload {
  WORKLOAD_UNSPECIFIED = 0;
  WORKLOAD_TESTS = 1;
  WORKLOAD_BUILD = 2;
  WORKLOAD_SCRIPT = 3;
  WORKLOAD_SERVE = 4;
  WORKLOAD_INFERENCE = 5;
  WORKLOAD_OTHER = 6;
}

// A feature the work needs, bugnet_quote's needs
enum Need {
  NEED_UNSPECIFIED = 0;
  NEED_SSH = 1;
  NEED_PREVIEW = 2;
  NEED_SECRETS = 3;
  NEED_GPU = 4;
}

message EstimateRequest {
  // Still honoured, merged with needs
  Requirements requirements = 1;
  // A GitHub URL with an optional ref, a Hugging Face model id, or empty, as the agent gave it
  string source = 2;
  Workload workload = 3;
  // The command the agent plans to run, at most 1,000 bytes, read for hints, never run or stored
  string entry_command = 4;
  // Minutes the agent expects, 1 to 1,440, absent when unknown
  optional uint32 expected_minutes = 5;
  repeated Need needs = 6;
}

enum SourceKind {
  SOURCE_KIND_UNSPECIFIED = 0;
  SOURCE_KIND_NONE = 1;
  SOURCE_KIND_GITHUB = 2;
  SOURCE_KIND_HUGGINGFACE_MODEL = 3;
  // A URL the estimator never fetches
  SOURCE_KIND_URL = 4;
}

// Why the estimator did not read a source
enum UnreadReason {
  UNREAD_REASON_UNSPECIFIED = 0;
  // Missing or private, which GitHub and Hugging Face answer the same way
  UNREAD_REASON_NOT_FOUND = 1;
  // Unavailable for legal reasons, HTTP 451
  UNREAD_REASON_LEGAL = 2;
  // Bugnet's share of the upstream rate limit is spent for now
  UNREAD_REASON_RATE_LIMITED = 3;
  // The fetch budget ended first
  UNREAD_REASON_TIMEOUT = 4;
  // A URL source, which is never fetched
  UNREAD_REASON_NOT_SUPPORTED = 5;
  // The upstream failed in another way
  UNREAD_REASON_UPSTREAM_ERROR = 6;
}

message ResolvedSource {
  SourceKind kind = 1;
  // github.com/owner/repo plus any subdirectory, huggingface.co/org/model, or a URL's origin
  string canonical = 2;
  // The ref or revision asked for, empty for the default branch
  string ref = 3;
  // The commit or revision SHA the estimate read, empty when it read nothing
  string revision = 4;
  bool read = 5;
  // Set when read is false
  UnreadReason unread_reason = 6;
}

enum GpuNeed {
  GPU_NEED_UNSPECIFIED = 0;
  GPU_NEED_NONE = 1;
  GPU_NEED_RECOMMENDED = 2;
  GPU_NEED_REQUIRED = 3;
}

message ResourceFloor {
  Resources resources = 1;
  uint32 minutes = 2;
  // Bytes the run is expected to download, such as model weights
  uint64 download_bytes = 3;
  GpuNeed gpu = 4;
  // The context length an inference floor assumes, 0 for other workloads
  uint32 context_tokens = 5;
}

enum EstimateBasis {
  ESTIMATE_BASIS_UNSPECIFIED = 0;
  ESTIMATE_BASIS_DEFAULTS = 1;
  ESTIMATE_BASIS_SIGNALS = 2;
  ESTIMATE_BASIS_HISTORY = 3;
}

enum Confidence {
  CONFIDENCE_UNSPECIFIED = 0;
  CONFIDENCE_LOW = 1;
  CONFIDENCE_MEDIUM = 2;
  CONFIDENCE_HIGH = 3;
}

enum WarningCode {
  WARNING_CODE_UNSPECIFIED = 0;
  WARNING_CODE_NEEDS_GPU = 1;
  WARNING_CODE_GPU_RECOMMENDED = 2;
  WARNING_CODE_TOO_LARGE = 3;
  WARNING_CODE_TRY_QUANTIZED = 4;
  WARNING_CODE_GATED_MODEL = 5;
  WARNING_CODE_SECRETS = 6;
  WARNING_CODE_SOURCE_UNREAD = 7;
  WARNING_CODE_NEEDS_DOCKER = 8;
  WARNING_CODE_NEEDS_EXTENSION = 9;
  WARNING_CODE_PAST_MAX_LIFETIME = 10;
  WARNING_CODE_BUSY = 11;
  WARNING_CODE_CONTEXT_ASSUMED = 12;
  WARNING_CODE_RAN_OUT_OF_MEMORY = 13;
}

message EstimateWarning {
  WarningCode code = 1;
  // One short line built from typed values, never from repository text or provider names
  string message = 2;
}

message EstimateReason {
  // Stable, such as dc.host or hf.weights
  string rule_id = 1;
  string message = 2;
}

message EstimateResponse {
  repeated PackageOption options = 1;
  // Pass to CreatePlacement via the quote, always a canonical 36-character UUID that fits 16 bytes
  string estimate_id = 2;
  string estimator_version = 3;
  // Hex SHA-256 of the canonical inputs
  string inputs_sha256 = 4;
  ResolvedSource source = 5;
  ResourceFloor floor = 6;
  // Empty when no package fits
  string recommended_package_id = 7;
  repeated EstimateReason reasons = 8;
  repeated EstimateWarning warnings = 9;
  EstimateBasis basis = 10;
  Confidence confidence = 11;
  // Some source data could not be read within the time budget
  bool partial = 12;
}

message PricePackageRequest {
  string package_id = 1;
  Requirements requirements = 2;
}

message PricePackageResponse {
  // The package now, available as a start would find it this moment
  PackageOption option = 1;
}

/* Placements */

enum PlacementState {
  PLACEMENT_STATE_UNSPECIFIED = 0;
  PLACEMENT_STATE_PLACING = 1;
  PLACEMENT_STATE_READY = 2;
  PLACEMENT_STATE_TERMINATING = 3;
  PLACEMENT_STATE_TERMINATED = 4;
  PLACEMENT_STATE_FAILED = 5;
}

message Placement {
  string placement_id = 1;
  PlacementState state = 2;
  string package_id = 3;
  google.protobuf.Timestamp deadline = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp ready_at = 6;
  string failure_reason = 7;
  bool refundable = 8;
  // Routing name for SSH, set at ready when the provider has SSH, empty otherwise
  string ssh_alias = 9;
  // stop, deadline, abuse, control_lost, provider_failed, sandbox_exited, wallet_blocked, operator
  string termination_reason = 10;
  // The repository the router placed in the sandbox
  Bootstrap bootstrap = 11;

  // Field 12 belongs to the base image task

  // When the placement became terminated or failed, unset before
  google.protobuf.Timestamp ended_at = 13;
}

message CreatePlacementRequest {
  string order_token = 1;
  Requirements requirements = 2;
  // Ties the run to its source, always a canonical 36-character UUID that fits 16 bytes
  string estimate_id = 3;
}

message CreatePlacementResponse {
  Placement placement = 1;
  // The handle is returned only here
  string handle = 2;
}

message GetPlacementRequest {
  string handle = 1;
  uint32 wait_ms = 2;
  PlacementState known_state = 3;
}

message GetPlacementResponse {
  Placement placement = 1;
}

message WatchPlacementRequest {
  string handle = 1;
}

message WatchPlacementResponse {
  Placement placement = 1;
}

message ExtendPlacementRequest {
  string handle = 1;
  string order_token = 2;
}

message ExtendPlacementResponse {
  Placement placement = 1;
}

message CheckExtendPlacementRequest {
  string handle = 1;
  string package_id = 2;
}

message CheckExtendPlacementResponse {
  Placement placement = 1;
  // The deadline the placement would have once extended by the package
  google.protobuf.Timestamp deadline = 2;
  // The checked package, priced from the catalog
  PackageOption package = 3;
}

message ListExtensionsRequest {
  string handle = 1;
}

message ListExtensionsResponse {
  // Every package that can extend the placement, available as CheckExtendPlacement would answer
  repeated PackageOption options = 1;
}

message StopPlacementRequest {
  string handle = 1;
}

message StopPlacementResponse {
  Placement placement = 1;
}

/* Jobs */

message Until {
  bool exit = 1;
  string output_pattern = 2;
  uint32 idle_ms = 3;
}

enum JobState {
  JOB_STATE_UNSPECIFIED = 0;
  JOB_STATE_RUNNING = 1;
  JOB_STATE_EXITED = 2;
  JOB_STATE_CANCELLED = 3;
  JOB_STATE_LOST = 4;
}

message ExecRequest {
  string handle = 1;
  repeated string argv = 2;
  string cwd = 3;
  map<string, string> env = 4;
  string idempotency_key = 5;
  uint32 wait_ms = 6;
  Until until = 7;
}

message ExecResponse {
  string job_id = 1;
  JobState state = 2;
  optional int32 exit_code = 3;
  bytes stdout_tail = 4;
  bytes stderr_tail = 5;
  string cursor = 6;
  bool truncated = 7;
  // The kernel's OOM killer ended a process of this job
  bool oom_killed = 8;
}

enum OutputStream {
  OUTPUT_STREAM_UNSPECIFIED = 0;
  OUTPUT_STREAM_STDOUT = 1;
  OUTPUT_STREAM_STDERR = 2;
}

message JobOutput {
  OutputStream stream = 1;
  uint64 offset = 2;
  bytes data = 3;
}

message JobExit {
  int32 exit_code = 1;
  uint64 stdout_bytes = 2;
  uint64 stderr_bytes = 3;
  // The kernel's OOM killer ended a process of this job
  bool oom_killed = 4;
  // The job's peak memory in MiB, 0 when the sandbox cannot measure it
  uint32 peak_memory_mib = 5;
}

// Output resumes at these offsets, the bytes skipped before them stay in the sandbox's job files
message JobSkip {
  uint64 stdout_offset = 1;
  uint64 stderr_offset = 2;
}

message WatchJobRequest {
  string handle = 1;
  string job_id = 2;
  string cursor = 3;
  Until until = 4;
}

message WatchJobResponse {
  oneof frame {
    JobOutput output = 1;
    JobExit exit = 2;
    bool heartbeat = 3;
    JobSkip skip = 5;
  }
  string cursor = 4;
}

message CancelJobRequest {
  string handle = 1;
  string job_id = 2;
}

message CancelJobResponse {
  JobState state = 1;
}

/* Files */

message ReadFileRequest {
  string handle = 1;
  string path = 2;
  uint64 offset = 3;
  uint32 length = 4;
}

message ReadFileResponse {
  bytes data = 1;
  bool eof = 2;
}

message WriteFileRequest {
  string handle = 1;
  string path = 2;
  bytes data = 3;
  uint32 mode = 4;
}

message WriteFileResponse {
  uint64 size = 1;
}

message FileEntry {
  string path = 1;
  uint64 size = 2;
  bool is_dir = 3;
  uint32 mode = 4;
  google.protobuf.Timestamp modified_at = 5;
}

message ListFilesRequest {
  string handle = 1;
  string path = 2;
  uint32 depth = 3;
}

message ListFilesResponse {
  repeated FileEntry entries = 1;
  // The listing stopped at the router's entry or directory limit
  bool truncated = 2;
}

/* Previews */

message CreatePreviewRequest {
  string handle = 1;
  uint32 port = 2;
}

message CreatePreviewResponse {
  // <id>.<preview domain>/?bugnet_token=bnp_...
  string url = 1;
  // The same token, for the Bugnet-Token header
  string token = 2;
  // The paid deadline
  google.protobuf.Timestamp expires_at = 3;
  // Something accepted a connection on the port when the router asked
  bool listening = 4;
  string preview_id = 5;
}

/* Transfers */

enum TransferDirection {
  TRANSFER_DIRECTION_UNSPECIFIED = 0;
  TRANSFER_DIRECTION_UPLOAD = 1;
  TRANSFER_DIRECTION_DOWNLOAD = 2;
}

message CreateTransferRequest {
  string handle = 1;
  TransferDirection direction = 2;
  // An absolute path, or ~ or ~/rest for the exec user's home
  string path = 3;
  // Uploads only, the exact size in bytes, required with 0 allowed, optional so presence shows
  optional uint64 size_bytes = 4;
  // Uploads only, permission bits, 0644 when 0
  uint32 mode = 5;
  // Uploads only, the expected SHA-256, checked before the file is replaced
  bytes sha256 = 6;
  // A repeated key returns the same URL
  string idempotency_key = 7;
  // Downloads only, asks for the file's SHA-256 at mint, ignored for uploads
  bool want_sha256 = 8;
}

message CreateTransferResponse {
  // <transfer host>/<token>
  string url = 1;
  // The transfer must start before this
  google.protobuf.Timestamp expires_at = 2;
  // The file's size now for a download, the declared size for an upload
  uint64 size = 3;
  // The per-file cap, the package's edge.transfer_max_bytes or else transfers.max_bytes
  uint64 max_bytes = 4;
  // Downloads only, the file's modification time
  google.protobuf.Timestamp modified_at = 5;
  // The file's SHA-256 at mint when a download set want_sha256, empty otherwise
  bytes sha256 = 6;
}

/* SSH */

message AddSshKeyRequest {
  string handle = 1;
  // One authorized_keys line without options
  string public_key = 2;
  // Echoed in the command, ~/.ssh/bugnet_<alias> when empty
  string identity_file = 3;
  // Echoed in the command, ~/.ssh/bugnet_known_hosts when empty
  string known_hosts_file = 4;
}

message AddSshKeyResponse {
  string alias = 1;
  string host = 2;
  uint32 port = 3;
  // SHA256 fingerprint of the added key
  string fingerprint = 4;
  // One line per current gateway host key
  repeated string known_hosts = 5;
  string command = 6;
  // An optional ssh_config stanza
  string config = 7;
  google.protobuf.Timestamp expires_at = 8;
}

message RemoveSshKeyRequest {
  string handle = 1;
  string fingerprint = 2;
}

message RemoveSshKeyResponse {}

/* Secrets */

message SecretSpec {
  // ^[A-Za-z_][A-Za-z0-9_]{0,63}$, not a reserved name
  string name = 1;
  // Exact lower-case host names in punycode
  repeated string hosts = 2;
  // Header names besides Authorization that may carry the placeholder
  repeated string header_names = 3;
  // Only the router's repository fetcher uses it, the sandbox gets no placeholder
  bool fetch_only = 4;
}

message SealedValue {
  string key_id = 1;
  // crypto_box_seal of the bound JSON payload, at most 70 KiB
  bytes box = 2;
}

message SealingKey {
  string key_id = 1;
  // X25519, 32 bytes
  bytes public_key = 2;
  // Ties a sealed value to one placement
  string binding = 3;
}

enum SecretState {
  SECRET_STATE_UNSPECIFIED = 0;
  SECRET_STATE_APPLYING = 1;
  SECRET_STATE_ACTIVE = 2;
  SECRET_STATE_FAILED = 3;
}

message SecretInfo {
  SecretSpec spec = 1;
  SecretState state = 2;
  google.protobuf.Timestamp updated_at = 3;
  // A stable code when the state is failed, such as PORT_443_TAKEN
  string failure_reason = 4;
}

// The page shows placements.source_label, never a label from the caller
message CreateSecretLinkRequest {
  string handle = 1;
  // Suggested name, optional
  string name = 2;
  // Suggested hosts, kept only when they are the preset of the suggested name
  repeated string hosts = 3;
  // A repeated id returns the same link
  string request_id = 4;
}

message CreateSecretLinkResponse {
  // <secrets host>/l/<token>
  string url = 1;
  // Six characters, shown in chat and on the page
  string pairing_code = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CreateSecretPutGrantRequest {
  string handle = 1;
}

message CreateSecretPutGrantResponse {
  // bnsp_..., valid for GetBridgeSealingKey and PutBridgeSecret on this placement only
  string put_grant = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message GetSecretSealingKeyRequest {
  string handle = 1;
}

message GetSecretSealingKeyResponse {
  // Every current key, newest first, the client seals with the newest one it pinned
  repeated SealingKey sealing_keys = 1;
}

message PutSecretRequest {
  string handle = 1;
  SecretSpec spec = 2;
  SealedValue value = 3;
  string idempotency_key = 4;
}

message PutSecretResponse {
  SecretInfo secret = 1;
  // A secret of that name existed and now has the new value
  bool replaced = 2;
}

message ListSecretsRequest {
  string handle = 1;
}

message ListSecretsResponse {
  repeated SecretInfo secrets = 1;
}

message DeleteSecretRequest {
  string handle = 1;
  string name = 2;
}

message DeleteSecretResponse {}

/* Sources */

enum BootstrapState {
  BOOTSTRAP_STATE_UNSPECIFIED = 0;
  // The placement has no GitHub source
  BOOTSTRAP_STATE_NONE = 1;
  // A GitHub source no one has fetched yet
  BOOTSTRAP_STATE_PENDING = 2;
  BOOTSTRAP_STATE_RUNNING = 3;
  BOOTSTRAP_STATE_DONE = 4;
  BOOTSTRAP_STATE_FAILED = 5;
  // Not readable without a token, add a GitHub secret and call again
  BOOTSTRAP_STATE_NEEDS_SECRET = 6;
}

message Bootstrap {
  BootstrapState state = 1;
  // Path of the checkout under the exec user's home, as ~/src/<repo>, set once known
  string path = 2;
  // The commit placed, empty until known
  string revision = 3;
  // The job that clones or unpacks it, for WatchJob
  string job_id = 4;
  // CLONE_FAILED, FETCH_FAILED, TOO_LARGE, INTERRUPTED, TOOL_MISSING, BUDGET_SPENT, ATTEMPTS_SPENT
  string failure_reason = 5;
}

message FetchSourceRequest {
  string handle = 1;
}

message FetchSourceResponse {
  Bootstrap bootstrap = 1;
}

/* x402 */

message X402ServiceSpec {
  string host = 1;
  // Starts and ends with a slash, at most 200 characters
  string prefix = 2;
  // GET or POST
  string method = 3;
  int64 max_price_micros = 4;
  // Canonical base58 of 32 bytes
  string pay_to = 5;
  // In Bugnet's index, so every path under the prefix is paid
  bool indexed = 6;
  // The one paid path of a service that is not indexed, empty when indexed
  string paid_path = 7;
}

enum X402ServiceState {
  X402_SERVICE_STATE_UNSPECIFIED = 0;
  X402_SERVICE_STATE_APPLYING = 1;
  X402_SERVICE_STATE_ACTIVE = 2;
  X402_SERVICE_STATE_FAILED = 3;
  X402_SERVICE_STATE_DISABLED = 4;
}

message X402ServiceInfo {
  string service_id = 1;
  X402ServiceSpec spec = 2;
  X402ServiceState state = 3;
  // A code such as PORT_443_TAKEN, FEATURE_UNAVAILABLE or HOST_BLOCKED, empty unless failed
  string failure_reason = 4;
  uint32 requests = 5;
  uint32 paid = 6;
  uint32 uncertain = 7;
}

message X402Refusal {
  // A refusal code of x402 spec 6.13, or refused_host
  string reason = 1;
  uint32 count = 2;
  google.protobuf.Timestamp last_at = 3;
}

// With a handle and nothing to add or disable, checks the switch, the capability and the state
message CheckX402Request {
  // Empty runs only the checks that need no placement, and then disable must be empty
  string handle = 1;
  repeated X402ServiceSpec add = 2;
  // Service ids
  repeated string disable = 3;
}

// A per-service refusal names the first failing add entry in ErrorInfo metadata service_id and host
message CheckX402Response {}

message EnableX402Request {
  string handle = 1;
  repeated X402ServiceSpec add = 2;
  // Service ids
  repeated string disable = 3;
  // 1 to 128 printable ASCII, logged and traced only
  string request_id = 4;
  // On a ready placement, waits up to secrets.apply_wait for the added rows to leave APPLYING
  bool wait_active = 5;
}

message EnableX402Response {
  repeated X402ServiceInfo services = 1;
}

message ListX402Request {
  string handle = 1;
}

message ListX402Response {
  bool enabled = 1;
  repeated X402ServiceInfo services = 2;
  // The placement's refusals by reason, with the last time each was seen
  repeated X402Refusal refusals = 3;
}
